
version: '3'

services:

  backend:
    build: ./backend

    ports:
      - "8000:8000"

    depends_on:
      - redis
      - mongodb
      - postgres

    restart: always

  worker:
    build: ./backend

    command: python -m app.worker

    depends_on:
      - redis
      - mongodb
      - postgres

    restart: always

  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: always

  redis:
    image: redis

    ports:
      - "6379:6379"

    restart: always

  mongodb:
    image: mongo

    ports:
      - "27017:27017"

    restart: always

  postgres:
    image: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ims

    ports:
      - "5432:5432"

    restart: always

