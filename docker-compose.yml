version: '3'

services:

  backend:
    build: ./backend

    ports:
      - "8000:8000"

    depends_on:
      - redis
      - mongodb
      - postgres

  redis:
    image: redis

    ports:
      - "6379:6379"

  mongodb:
    image: mongo

    ports:
      - "27017:27017"

  postgres:
    image: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ims

    ports:
      - "5432:5432"
